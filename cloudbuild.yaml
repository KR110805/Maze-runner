steps:
  # 1. Run automated unit tests before building container
  - name: 'node:22-alpine'
    entrypoint: 'npm'
    args: ['test']

  # 2. Build Docker container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/acm-maze-game:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/acm-maze-game:latest'
      - '.'

  # 3. Push container image to Google Container Registry / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/acm-maze-game:$COMMIT_SHA']

  # 4. Deploy to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'acm-maze-game'
      - '--image'
      - 'gcr.io/$PROJECT_ID/acm-maze-game:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--concurrency'
      - '300'
      - '--cpu'
      - '2'
      - '--memory'
      - '2Gi'
      - '--min-instances'
      - '1'
      - '--max-instances'
      - '10'

images:
  - 'gcr.io/$PROJECT_ID/acm-maze-game:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/acm-maze-game:latest'
