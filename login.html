<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACM Maze Runner | Host Authorization</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            padding: 24px;
            min-height: 100vh;
            background-color: #060913;
            background-image: 
                radial-gradient(at 15% 15%, rgba(56, 189, 248, 0.15) 0px, transparent 50%),
                radial-gradient(at 85% 85%, rgba(244, 63, 94, 0.12) 0px, transparent 50%);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            width: 100%;
            max-width: 440px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 16px;
            padding: 36px 32px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 0 0 30px rgba(56, 189, 248, 0.15);
            text-align: center;
        }

        .badge-tag {
            display: inline-block;
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            padding: 4px 12px;
            border-radius: 9999px;
            background: rgba(56, 189, 248, 0.15);
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.3);
            margin-bottom: 14px;
        }

        .login-title {
            font-size: 1.8rem;
            font-weight: 900;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #ffffff 0%, #38bdf8 60%, #818cf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .login-subtitle {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-bottom: 24px;
            line-height: 1.4;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .input-group {
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 700;
            color: #cbd5e1;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .login-input {
            width: 100%;
            background: rgba(2, 6, 23, 0.8);
            border: 1px solid rgba(56, 189, 248, 0.25);
            border-radius: 8px;
            padding: 12px 16px;
            color: #ffffff;
            font-size: 1rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .login-input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.3);
        }

        .btn-submit {
            background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
            color: #ffffff;
            font-weight: 800;
            font-size: 1rem;
            border: none;
            border-radius: 8px;
            padding: 14px 20px;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(2, 132, 199, 0.4);
            transition: transform 0.15s, box-shadow 0.15s;
        }

        .btn-submit:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(2, 132, 199, 0.6);
        }

        .btn-submit:active {
            transform: translateY(1px);
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.5);
            color: #fca5a5;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.88rem;
            font-weight: 600;
            margin-bottom: 16px;
            display: none;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #64748b;
            font-size: 0.85rem;
            text-decoration: none;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: #38bdf8;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <span class="badge-tag">Host Authentication</span>
        <h1 class="login-title">ACM MAZE SHOWDOWN</h1>
        <p class="login-subtitle">
            Enter the event Host Secret to establish a secure 24-hour host session.
        </p>

        <div id="errorAlert" class="alert-error"></div>

        <form class="login-form" method="POST" action="/login">
            <div class="input-group">
                <label for="passwordInput">Host Secret Key</label>
                <input 
                    type="password" 
                    id="passwordInput" 
                    name="password" 
                    class="login-input" 
                    placeholder="Enter Host Key" 
                    required 
                    autofocus
                    autocomplete="current-password"
                >
            </div>
            <button type="submit" class="btn-submit">
                🔐 Authorize & Enter Dashboard
            </button>
        </form>

        <a href="/index.html" class="back-link">← Return to Player View</a>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const errEl = document.getElementById("errorAlert");
        if (params.get("error") === "locked") {
            errEl.innerText = "⚠️ Too many failed attempts. Temporary 5-minute lockout.";
            errEl.style.display = "block";
        } else if (params.get("error") === "1" || params.has("error")) {
            errEl.innerText = "⚠️ Invalid Host Secret. Access denied.";
            errEl.style.display = "block";
        }
    </script>
</body>
</html>
